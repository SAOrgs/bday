<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday sadhuuu 🎀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(160deg, #fff7f2, #ffe3ee 55%, #ffd1e3);
    }

    /* Splash screen */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #fff7f2, #ffe3ee 50%, #ffd1e3);
      cursor: pointer; text-align: center; padding: 30px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash span.bow { font-size: clamp(4rem, 14vw, 8rem); }
    #splash h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: #ff9ec4;
    }
    #splash p { font-size: 1.2rem; color: #9a7c88; }

    /* The iframe that holds each page */
    #site-frame {
      width: 100%; height: 100%;
      border: none; display: block;
    }
  </style>
</head>
<body>

  <!-- SPLASH — one tap unlocks audio + reveals the site -->
  <div id="splash">
    <span class="bow">🎀</span>
    <h1>You have a surprise waiting...</h1>
    <p>tap anywhere to open 💕</p>
  </div>

  <style>
    @keyframes splashFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
  </style>

  <!-- Audio lives HERE so it never gets interrupted by navigation -->
  <audio id="bg-music" loop preload="auto" src="audio/song.mp3"></audio>

  <!-- All pages load inside this frame -->
  <iframe id="site-frame" src="home.html"></iframe>

  <script>
    const splash = document.getElementById('splash');
    const audio = document.getElementById('bg-music');
    const frame = document.getElementById('site-frame');

    // On tap: start music + hide splash
    splash.addEventListener('click', () => {
      audio.play();
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 700);
    });

    // Listen for navigation requests from inside the iframe.
    // Each page's links will call parent.navigateTo('page.html')
    window.navigateTo = function(url) {
      frame.src = url;
    };
  </script>
</body>
</html>
